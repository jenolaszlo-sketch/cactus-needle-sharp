name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore CactusNeedleSharp.slnx
      - run: dotnet build CactusNeedleSharp.slnx --no-restore --configuration Release
      - run: dotnet test tests/CactusNeedleSharp.Tests/CactusNeedleSharp.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore src/CactusNeedleSharp/CactusNeedleSharp.csproj
      - run: dotnet pack src/CactusNeedleSharp/CactusNeedleSharp.csproj --no-restore --configuration Release --output artifacts/packages
      - run: dotnet restore src/CactusNeedleSharp.Worker/CactusNeedleSharp.Worker.csproj
      - run: dotnet pack src/CactusNeedleSharp.Worker/CactusNeedleSharp.Worker.csproj --no-restore --configuration Release --output artifacts/packages
      - run: dotnet restore src/CactusNeedleSharp.Baize/CactusNeedleSharp.Baize.csproj
      - run: dotnet pack src/CactusNeedleSharp.Baize/CactusNeedleSharp.Baize.csproj --no-restore --configuration Release --output artifacts/packages
      - name: Verify package contents and licensing boundary
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/packages/CactusNeedleSharp*.nupkg)
          if ($packages.Count -ne 3) { throw "Expected core, worker, and Baize NuGet packages; found $($packages.Count)." }
          foreach ($package in $packages) { ./eng/Verify-NuGetPackage.ps1 -PackagePath $package.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
