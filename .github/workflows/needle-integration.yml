name: Needle native integration

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/CactusNeedleSharp.IntegrationTests/**"
      - ".github/workflows/needle-integration.yml"
      - "Directory.Build.props"
      - "global.json"
  pull_request:
    paths:
      - "src/**"
      - "tests/CactusNeedleSharp.IntegrationTests/**"
      - ".github/workflows/needle-integration.yml"
      - "Directory.Build.props"
      - "global.json"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: needle-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            architecture: X64
          - name: Windows ARM64
            runner: windows-11-arm
            architecture: Arm64
          - name: Linux x64
            runner: ubuntu-24.04
            architecture: X64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            architecture: Arm64
          - name: macOS ARM64
            runner: macos-15
            architecture: Arm64
          - name: macOS x64
            runner: macos-15-intel
            architecture: X64

    env:
      NEEDLE_RUN_INTEGRATION_TESTS: "1"
      NEEDLE_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Configure runtime cache path
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "NEEDLE_TEST_CACHE_DIRECTORY=$env:RUNNER_TEMP/cactus-needle-runtime"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Cache official Cactus runtime and Needle 3 weights
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cactus-needle-runtime
          key: cactus-4.1.4-needle3-d6c7d6a-${{ runner.os }}-${{ runner.arch }}

      - name: Restore
        run: dotnet restore tests/CactusNeedleSharp.IntegrationTests/CactusNeedleSharp.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/CactusNeedleSharp.IntegrationTests/CactusNeedleSharp.IntegrationTests.csproj --no-restore --configuration Release

      - name: Select worker path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "Add-Content -Path $env:GITHUB_ENV -Value 'NEEDLE_WORKER_PATH=${{ github.workspace }}/src/CactusNeedleSharp.Worker/bin/Release/net8.0/CactusNeedleSharp.Worker.exe'"

      - name: Select worker path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "NEEDLE_WORKER_PATH=${{ github.workspace }}/src/CactusNeedleSharp.Worker/bin/Release/net8.0/CactusNeedleSharp.Worker" >> "$GITHUB_ENV"

      - name: Run native integration and offline reuse tests
        run: dotnet test tests/CactusNeedleSharp.IntegrationTests/CactusNeedleSharp.IntegrationTests.csproj --no-build --configuration Release --filter "Category=NeedleIntegration" --logger "console;verbosity=normal"

  musl-integration:
    name: Linux musl ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: X64
          - runner: ubuntu-24.04-arm
            architecture: Arm64
    steps:
      - uses: actions/checkout@v5
      - name: Run real inference and worker tests on Alpine
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/cactus-musl-cache"
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            -v "${{ runner.temp }}/cactus-musl-cache:/cactus-cache" \
            -e DOTNET_ROLL_FORWARD=Major -e DOTNET_NOLOGO=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e NEEDLE_RUN_INTEGRATION_TESTS=1 -e NEEDLE_EXPECTED_ARCHITECTURE=${{ matrix.architecture }} \
            -e NEEDLE_TEST_CACHE_DIRECTORY=/cactus-cache \
            -e NEEDLE_WORKER_PATH=/src/src/CactusNeedleSharp.Worker/bin/Release/net8.0/CactusNeedleSharp.Worker \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            dotnet test tests/CactusNeedleSharp.IntegrationTests -c Release --filter Category=NeedleIntegration
