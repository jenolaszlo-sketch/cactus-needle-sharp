name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$tag' must use the form v1.2.3 or v1.2.3-preview.1."
            }
            $version = $Matches.version
          }
          else {
            [xml] $xml = Get-Content -LiteralPath Directory.Build.props
            $version = [string] $xml.Project.PropertyGroup.Version
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Package version '$version' is not a supported semantic version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing CactusNeedleSharp $version"

      - name: Restore
        run: dotnet restore CactusNeedleSharp.slnx

      - name: Build and test
        run: dotnet test tests/CactusNeedleSharp.Tests/CactusNeedleSharp.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/CactusNeedleSharp/CactusNeedleSharp.csproj --no-restore --configuration Release --output artifacts/packages --property:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/CactusNeedleSharp.Worker/CactusNeedleSharp.Worker.csproj --no-restore --configuration Release --output artifacts/packages --property:PackageVersion="$PACKAGE_VERSION"

      - name: Verify package contents and licensing boundary
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/packages/CactusNeedleSharp*.nupkg)
          if ($packages.Count -ne 2) {
            throw "Expected core and worker NuGet packages; found $($packages.Count)."
          }
          foreach ($package in $packages) {
            ./eng/Verify-NuGetPackage.ps1 -PackagePath $package.FullName
          }

      - name: Authenticate to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet trusted publishing did not return a temporary API key.'
          }
          foreach ($package in Get-ChildItem artifacts/packages/CactusNeedleSharp*.nupkg) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
